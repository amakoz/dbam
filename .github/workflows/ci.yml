name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run catalog:check
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned: `latest` hits the unauthenticated GitHub API rate limit (F23)
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Test database access rules (pgTAP)
        run: supabase test db
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  # Applies supabase/migrations to production before any deploy that may depend on them. A Worker rollback never
  # undoes a migration, so migrations stay additive-first. Never run `supabase db push` against production by hand.
  migrate:
    needs: [ci, smoke]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-migrate
      cancel-in-progress: false # never kill a migration that's already running
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned: `latest` hits the unauthenticated GitHub API rate limit (F23)
      # Session-pooler URL (runners are IPv4-only), password percent-encoded. --skip-vault: never overwrite
      # production vault secrets from config.toml. No --include-seed / --include-roles, and never `config push`.
      - name: Apply migrations to production
        run: supabase db push --db-url "$SUPABASE_DB_URL" --skip-vault --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: [ci, smoke, migrate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false # never kill a deploy that's already running
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --no-x-provision --message "$DEPLOY_MESSAGE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MESSAGE: "${{ github.event_name }}: ${{ github.sha }}"
      - name: Post-deploy health check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for i in $(seq 1 10); do
            curl -sf -o /dev/null "$PRODUCTION_URL/api/health" && exit 0
            sleep 3
          done
          echo "::error::Health check failed. Roll back with: npx wrangler rollback -m 'health check failed' -y"
          exit 1
      # A new Worker version takes up to a minute to reach every edge location, so right after `wrangler deploy` some
      # requests still hit the previous version (a route added by this deploy can 404). Retry before failing.
      - name: Post-deploy smoke (read-only)
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
          SMOKE_READONLY: "1"
        run: |
          for attempt in 1 2 3; do
            npm run smoke && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Read-only smoke failed (attempt $attempt/3), likely rollout propagation; retrying in 20 s"
              sleep 20
            fi
          done
          echo "::error::Read-only smoke failed 3 times. Roll back with: npx wrangler rollback -m 'post-deploy smoke failed' -y"
          exit 1
